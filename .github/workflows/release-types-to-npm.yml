name: Release Types to npm

on:
  # A push to main publishes a snapshot
  push:
    branches:
      - main
  # The release tag lands on a [skip ci] commit, and [skip ci] only blocks push and pull_request
  create:
  workflow_dispatch: null

permissions:
  contents: read
  id-token: write

jobs:
  publish-types:
    # create also fires on a new branch, and takes no tag filter
    if: github.event_name != 'create' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
      - name: Build and publish
        run: |
          # Leaves out the v*-tests.* tags of the test module
          if [ "$GITHUB_REF_TYPE" = "tag" ] && ! [[ "$GITHUB_REF_NAME" =~ ^[0-9]+_[0-9]+_[0-9]+$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not a release tag, nothing to publish"
            exit 0
          fi
          YARN_ENABLE_SCRIPTS=false yarn install --immutable
          tag=$(yarn node -p 'process.env.npm_package_version.endsWith("SNAPSHOT")?"snapshot":"latest"')
          # The GitHub release first pushes its tag on the snapshot commit, before the Maven release moves it
          if [ "$tag" = "snapshot" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "Tag $GITHUB_REF_NAME carries a snapshot version, nothing to publish"
            exit 0
          fi
          yarn build:types
          if [ "$tag" = "snapshot" ]; then
            # Append timestamp to snapshot versions to ensure uniqueness
            yarn node -e 'f=process.env.npm_package_json;fs.writeFileSync(f,fs.readFileSync(f,"utf8").replace(/("version": ".+)"/,`$1.${+new Date}"`))'
          fi
          yarn npm publish --access public --tolerate-republish --provenance --tag $tag
