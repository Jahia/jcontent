name: Release Types to npm

on:
  push:
    branches:
      - main
    # The release action pushes the tag once the Maven release has set package.json to the release version
    tags:
      - '[0-9]+_[0-9]+_[0-9]+'
  workflow_dispatch: null

permissions:
  contents: read
  id-token: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
      - name: Build and publish
        run: |
          yarn install
          tag=$(yarn node -p 'process.env.npm_package_version.endsWith("SNAPSHOT")?"snapshot":"latest"')
          # The GitHub release first pushes its tag on the snapshot commit, before the Maven release moves it
          if [ "$tag" = "snapshot" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "Tag $GITHUB_REF_NAME carries a snapshot version, nothing to publish"
            exit 0
          fi
          yarn build:types
          if [ "$tag" = "snapshot" ]; then
            # Append timestamp to snapshot versions to ensure uniqueness
            yarn node -e 'f=process.env.npm_package_json;fs.writeFileSync(f,fs.readFileSync(f,"utf8").replace(/("version": ".+)"/,`$1.${+new Date}"`))'
          fi
          yarn npm publish --access public --tolerate-republish --provenance --tag $tag
