
# uninstall only if it exists, otherwise it throws an error
# need to hardcode version for uninstall
- if: org.jahia.osgi.BundleUtils.getBundleBySymbolicName('content-editor',null) != null
  do:
    - uninstallBundle: 'mvn:org.jahia.modules/content-editor/3.6.0'

- addMavenRepository: 'https://devtools.jahia.com/nexus/content/groups/public/@snapshots@noreleases@id=JahiaPublicSnapshots'
# The jcontent-owned coordinates below are version-pinned on purpose. Left unversioned, Maven
# resolves the HIGHEST snapshot in the repository, which is not necessarily the line this branch
# builds: a snapshot of another line (a maintenance branch, or an abandoned one) can sit above
# it, and an unversioned coordinate then silently installs that artifact instead of this line.
# Keep these in step with the version in the root pom.xml.
- installBundle:
    - 'mvn:org.jahia.modules/jcontent/3.8.0-SNAPSHOT'
    - 'mvn:org.jahia.modules/jahia-page-composer'
    - 'mvn:org.jahia.modules/jahia-administration'
    - 'mvn:org.jahia.modules/graphql-dxm-provider'
    - 'mvn:org.jahia.modules/jahia-ui-root'
    - 'mvn:org.jahia.test/jcontent-test-module/3.8.0-SNAPSHOT'
    - 'mvn:org.jahia.test/jcontent-test-template/3.8.0-SNAPSHOT'
    - 'js:mvn:org.jahia.modules.javascript/jcontent-test-js-template/LATEST/tgz'
  autoStart: true
  uninstallPreviousVersion: true
- include: 'provisioning.yml'
